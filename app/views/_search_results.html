<hr>

<div class="panel panel-default search-results">
  <div class="panel-heading">
    <h3 class="panel-title">Search Results</h3>
  </div>
  <div class="panel-body">

    <% if (photos.length) { %>
      <!-- Etape 1: Bouton pour déclencher le zippage en appelant POST /zip avec les tags en query params -->
      <div style="margin-bottom: 15px;">
        <form action="/zip?tags=<%= tagsParameter %>&tagmode=<%= tagmodeParameter %>" method="POST">
          <button type="submit" class="btn btn-primary">
            <i class="glyphicon glyphicon-compressed"></i> Zipper les 10 premières photos
          </button>
        </form>
      </div>

      <ul>
        <% photos.forEach(function (photo) { %>
          <li class="list-unstyled">
            <a href="<%= photo.media.b %>" class="thumbnail">
              <img src="<%= photo.media.t %>" alt="Photo - <%= photo.title %>"
                title="<%= photo.title %>">
            </a>
          </li>
        <% }) %>
      </ul>

    <% } else { %>
      <div class="alert alert-info"><strong>No results</strong></div>
    <% } %>

  </div>

</div>
